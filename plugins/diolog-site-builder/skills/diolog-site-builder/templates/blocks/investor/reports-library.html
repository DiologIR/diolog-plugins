<!-- BLOCK reports-library → documentsLibrary (featured-index). slots: eyebrow, heading -->
<section class="band band--tight reveal">
  <div class="gutter">
    <!-- diolog-widget: {"kind":"documentsLibrary","variant":"featured-index","config":{"showAskAi":true,"showFileMeta":true,"groupBy":"year"},"styleOverrides":{},"note":"Reports & decks library, served live. Configure grouping via portal editor."} -->
    <div class="wframe">
      <div class="wframe__head"><div><p class="wframe__eyebrow">{{eyebrow|§ Featured}}</p><h2 class="wframe__title" style="font-size:var(--fs-h3)">{{heading|Reports & presentations}}</h2></div><span class="live-tag">Live</span></div>
      <div class="wmarker" data-diolog-widget="documentsLibrary" data-widget-variant="featured-index" aria-label="Reports library">
        <div class="split2" style="align-items:center">
          <div class="ph-img" style="--ph-ar: 1 / 1.35;max-width:280px" role="img" aria-label="Placeholder report cover"><span class="ph-img__label">REPORT COVER<b>600×810</b></span></div>
          <div><p class="wframe__eyebrow">Featured document</p><h3 class="wframe__title" style="margin:var(--sp-2) 0 var(--sp-4)">Document title is served live</h3><div class="wf-bar" style="width:92%"></div><div class="wf-bar wf-bar--sm mt-4" style="width:80%"></div><div class="wf-bar wf-bar--sm" style="width:68%"></div><div class="callout" style="margin-top:var(--sp-5);padding:var(--sp-4)"><p class="callout__label" style="margin:0">AI précis · reviewed by IR</p></div><div class="mt-6" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" type="button">Download</button><button class="btn btn-ghost" type="button" data-open="palette">Ask AI about this report</button></div></div>
        </div>
        <div class="mt-8"><p class="wframe__eyebrow">[Most recent year]</p><div class="wf-rows">
          <div class="wf-row" style="grid-template-columns:1fr auto auto"><div class="wf-bar" style="width:44%"></div><span class="dotlead"></span><span class="tag">[type]</span><span class="tag">[NN pp]</span></div>
          <div class="wf-row" style="grid-template-columns:1fr auto auto"><div class="wf-bar" style="width:38%"></div><span class="dotlead"></span><span class="tag">[type]</span><span class="tag">[NN pp]</span></div>
          <div class="wf-row" style="grid-template-columns:1fr auto auto"><div class="wf-bar" style="width:50%"></div><span class="dotlead"></span><span class="tag">[type]</span><span class="tag">[NN pp]</span></div>
        </div></div>
        <span class="wframe__note">Every document, its type, page count and file are served live.</span>
      </div>
    </div>
  </div>
</section>
