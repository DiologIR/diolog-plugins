<!-- BLOCK announcements-feed → announcements (featured) + announcementReader (summary). slots: eyebrow, heading, link_* -->
<section class="band band--tight reveal">
  <div class="gutter">
    <div class="shead shead--row"><div><p class="eyebrow">{{eyebrow|§02 The latest}}</p><h2>{{heading|A company in its own words.}}</h2></div><a class="flink" href="{{link_href|announcements.html}}">{{link_label|All announcements}}</a></div>
    <div class="split2">
      <!-- diolog-widget: {"kind":"announcementReader","variant":"summary-only","config":{"showAiSummary":true,"showCitation":true},"styleOverrides":{},"note":"Featured announcement AI summary, served live."} -->
      <div class="wframe">
        <div class="wframe__head"><div><p class="wframe__eyebrow">Featured</p><h3 class="wframe__title">Latest disclosure</h3></div><span class="badge">Live</span></div>
        <div class="wmarker" data-diolog-widget="announcementReader" data-widget-variant="summary-only" aria-label="Featured announcement summary">
          <div class="callout"><p class="callout__label">AI summary · reviewed by IR</p><div class="wf-bar" style="width:92%"></div><div class="wf-bar wf-bar--sm mt-4" style="width:84%"></div><div class="wf-bar wf-bar--sm" style="width:76%"></div></div>
          <span class="wframe__note">Refer to the original PDF. Verified when published.</span>
        </div>
      </div>
      <!-- diolog-widget: {"kind":"announcements","variant":"featured","config":{"itemsToShow":4,"highlightFilings":true,"showAiSummary":true},"styleOverrides":{},"note":"Recent announcements list, served live."} -->
      <div class="wframe">
        <div class="wframe__head"><div><p class="wframe__eyebrow">Recent</p><h3 class="wframe__title">More announcements</h3></div></div>
        <div class="wmarker" data-diolog-widget="announcements" data-widget-variant="featured" aria-label="Recent announcements">
          <div class="wf-rows">
            <div class="wf-row"><div style="flex:1"><div class="wf-bar" style="width:36%"></div><div class="wf-bar wf-bar--sm mt-4" style="width:72%"></div></div><span class="badge">Live</span></div>
            <div class="wf-row"><div style="flex:1"><div class="wf-bar" style="width:30%"></div><div class="wf-bar wf-bar--sm mt-4" style="width:66%"></div></div><span class="badge badge--flag">Price-sensitive</span></div>
            <div class="wf-row"><div style="flex:1"><div class="wf-bar" style="width:34%"></div><div class="wf-bar wf-bar--sm mt-4" style="width:60%"></div></div><span class="badge">Live</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
