<!-- BLOCK governance → companySnapshot (split). slots: eyebrow, heading -->
<section class="band band--tight reveal">
  <div class="wrap">
    <p class="eyebrow">{{eyebrow|§ Governance}}</p>
    <h2 class="measure">{{heading|How the board is composed.}}</h2>
    <!-- diolog-widget: {"kind":"companySnapshot","variant":"split","config":{"facts":[]},"styleOverrides":{},"note":"Governance snapshot, served live."} -->
    <div class="wframe mt-8">
      <div class="wmarker" data-diolog-widget="companySnapshot" data-widget-variant="split" aria-label="Governance snapshot">
        <div class="grid grid-3">
          <div><p class="wframe__eyebrow">Independent directors</p><div class="wf-bar wf-bar--lg mt-4" style="width:50%"></div></div>
          <div><p class="wframe__eyebrow">Board tenure</p><div class="wf-bar wf-bar--lg mt-4" style="width:60%"></div></div>
          <div><p class="wframe__eyebrow">Board composition</p><div class="wf-bar wf-bar--lg mt-4" style="width:56%"></div></div>
        </div>
        <span class="wframe__note">Governance figures are served live.</span>
      </div>
    </div>
  </div>
</section>
