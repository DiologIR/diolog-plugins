<!-- BLOCK faq — plain interactive accordion (no widget). slots: eyebrow, heading, q1,a1 … q4,a4 -->
<section class="band band--tight reveal">
  <div class="wrap">
    <p class="eyebrow">{{eyebrow|§ FAQs}}</p>
    <h2 class="measure">{{heading|Common questions.}}</h2>
    <div class="acc mt-8">
      <div class="acc__item"><button class="acc__btn" type="button" aria-expanded="false"><span>{{q1|A first common question?}}</span><span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button><div class="acc__panel"><p>{{a1|A plain placeholder answer to the first question.}}</p></div></div>
      <div class="acc__item"><button class="acc__btn" type="button" aria-expanded="false"><span>{{q2|A second common question?}}</span><span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button><div class="acc__panel"><p>{{a2|A plain placeholder answer to the second question.}}</p></div></div>
      <div class="acc__item"><button class="acc__btn" type="button" aria-expanded="false"><span>{{q3|A third common question?}}</span><span class="chev" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></button><div class="acc__panel"><p>{{a3|A plain placeholder answer to the third question.}}</p></div></div>
    </div>
  </div>
</section>
