<!-- BLOCK testimonial — a single quote. slots: quote, attribution, role -->
<section class="band reveal">
  <div class="wrap center">
    <p class="eyebrow" style="justify-content:center">{{eyebrow|§ In their words}}</p>
    <blockquote style="font-family:var(--font-display);font-size:clamp(1.4rem,1rem+1.6vw,2rem);line-height:1.35;max-width:22ch;margin:var(--sp-6) auto 0;letter-spacing:-0.01em">{{quote|A short placeholder quote from a customer or partner goes here.}}</blockquote>
    <p class="tag mt-6" style="text-transform:none;letter-spacing:0">{{attribution|Name Surname}} · {{role|Role, Organisation}}</p>
  </div>
</section>
