<!-- BLOCK stat-band — 4 numeric stat tiles. slots: eyebrow, heading, s1_v,s1_k … (values MUST be numeric) -->
<section class="band band--tight reveal">
  <div class="gutter">
    <p class="eyebrow">{{eyebrow|§ By the numbers}}</p>
    <h2 class="measure">{{heading|A few figures worth leading with.}}</h2>
    <div class="stats mt-8">
      <div class="stat"><span class="stat__v">{{s1_v|20XX}}</span><span class="stat__k">{{s1_k|Placeholder: founded}}</span></div>
      <div class="stat"><span class="stat__v">{{s2_v|000}}</span><span class="stat__k">{{s2_k|Placeholder: people}}</span></div>
      <div class="stat"><span class="stat__v">{{s3_v|00}}</span><span class="stat__k">{{s3_k|Placeholder: locations}}</span></div>
      <div class="stat"><span class="stat__v">{{s4_v|00}}</span><span class="stat__k">{{s4_k|Placeholder: metric}}</span></div>
    </div>
  </div>
</section>
