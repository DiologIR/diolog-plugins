<!-- BLOCK hero-centered — centered statement + two CTAs. slots: eyebrow, headline, accent_word, lead, cta1_*, cta2_* -->
<section class="band hero center">
  <div class="wrap">
    <p class="eyebrow reveal" style="justify-content:center">{{eyebrow|§ Welcome}}</p>
    <h1 class="reveal" style="max-width:18ch;margin-inline:auto">{{headline|A clear, confident }} <span class="accent-word">{{accent_word|statement}}</span>{{headline_tail|.}}</h1>
    <p class="lead reveal" style="margin-inline:auto;margin-top:var(--sp-4)">{{lead|A single placeholder sentence that frames the whole site. Replace it with the company's own line.}}</p>
    <div class="hero__cta reveal" style="justify-content:center">
      <a class="btn btn-primary btn-lg" href="{{cta1_href|services.html}}">{{cta1_label|What we do}}</a>
      <a class="btn btn-ghost btn-lg" href="{{cta2_href|contact.html}}">{{cta2_label|Contact us}}</a>
    </div>
  </div>
</section>
