<!-- TEMPLATE section-break
     Use for: the hinge between two parts of a longer deck (eight slides or
     more). It gives the reader a place to breathe and tells them where they
     are, which a run of dense slides cannot.
     Slots: NUM (the part number) · EYEBROW · TITLE · SUMMARY
     Rules: a section break carries no data. If a figure has appeared on it, it
            is a content slide wearing a section break's clothes.
            Use the same treatment for every break in the deck — alternating
            them turns a wayfinding device into decoration. -->
<section class="slide" id="s{{N}}" data-screen-label="{{NN}} {{LABEL}}">
  <div class="stage" style="background:var(--dark)">
    <div class="pad" style="justify-content:center">
      <hr class="rule" />
      <p class="eyebrow on-dark">{{EYEBROW}}</p>
      <div style="display:flex;align-items:baseline;gap:44px;margin-top:24px;height:auto">
        <span class="mono" style="font-size:var(--t-display);font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--brand-on-dark)">{{NUM}}</span>
        <h2 class="display on-dark" style="max-width:16ch"><span>{{TITLE}}</span></h2>
      </div>
      <p class="lead on-dark" style="margin-top:44px;max-width:54ch"><span>{{SUMMARY}}</span></p>
    </div>
    <div class="foot on-dark">
      <span>{{FOOT_LEFT}}</span>
      <span>{{NN}}</span>
    </div>
  </div>
</section>
