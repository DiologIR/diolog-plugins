<!-- TEMPLATE credential-cards
     Use for: a person, an appointment, an award, a capability — anything whose
     evidence is three or four discrete facts rather than a narrative.
     Slots: EYEBROW · TITLE · LEAD · three × CARD (a figure or a heading, plus
            one clause) · CLOSING
     Rules: never generate a portrait of a real named person. There is no
            acceptable way to synthesise the likeness of an actual director,
            and a stock face attached to a real name is worse. Facts in cards
            carry a biography perfectly well, which is why this template exists.
            One card may lead with a figure (years, count); the rest lead with a
            heading. Three figures in a row is a stat-row, not a bio.
     Light variant: drop `style="background:var(--dark)"`, the `.on-dark`
            classes and `.card.dark`. -->
<section class="slide" id="s{{N}}" data-screen-label="{{NN}} {{LABEL}}">
  <div class="stage" style="background:var(--dark)">
    <div class="pad" style="justify-content:center">
      <hr class="rule" />
      <p class="eyebrow on-dark">{{EYEBROW}}</p>
      <h2 class="title on-dark" style="margin-top:20px;max-width:22ch"><span>{{TITLE}}</span></h2>
      <p class="lead on-dark" style="margin-top:32px;max-width:52ch"><span>{{LEAD}}</span></p>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:64px;height:auto;align-items:stretch">
        <div class="card dark" style="padding:44px">
          <span class="mono" style="font-size:var(--t-stat-md);font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--on-dark)">{{C1_FIG}}<span style="font-size:var(--t-card);color:var(--on-dark-muted)">{{C1_UNIT}}</span></span>
          <p class="small on-dark" style="margin-top:24px"><span>{{C1_BODY}}</span></p>
        </div>
        <div class="card dark" style="padding:44px">
          <p class="h"><span>{{C2_HEAD}}</span></p>
          <p class="small on-dark" style="margin-top:18px"><span>{{C2_BODY}}</span></p>
        </div>
        <div class="card dark" style="padding:44px">
          <p class="h"><span>{{C3_HEAD}}</span></p>
          <p class="small on-dark" style="margin-top:18px"><span>{{C3_BODY}}</span></p>
        </div>
      </div>

      <p class="small on-dark" style="margin-top:56px;max-width:110ch"><span>{{CLOSING}}</span></p>
    </div>
    <div class="foot on-dark">
      <span>{{FOOT_LEFT}}</span>
      <span>{{NN}}</span>
    </div>
  </div>
</section>
